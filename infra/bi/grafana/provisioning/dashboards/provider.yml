# 대시보드 파일 프로비저닝 — /var/lib/grafana/dashboards 의 JSON 자동 로드.
apiVersion: 1
providers:
  - name: ERP
    orgId: 1
    folder: ERP 경영
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
