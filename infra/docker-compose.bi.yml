# ERP 자체 BI 도구 (P1 Grafana · P2 Metabase) — reporting 마트 전용·읽기전용(erp_bi).
# his-grafana(HIS 소유)와 별개. 기획서 docs/01-plan/features/bi-tool-integration.plan.md §6·§8.
# opt-in: 본 compose는 명시 기동 시에만(coloc 백엔드와 분리). reporting 마트만 읽음(운영/PII 무접근).
#
# 사전: cp .env.bi.example .env.bi → ERP_BI_PASSWORD(정본=prod infra/.env.bi)·GF_ADMIN_PASSWORD 설정.
# 기동: docker compose -f docker-compose.bi.yml --env-file .env.bi up -d
# 접근(POC): SSH 터널 -L 3011:127.0.0.1:3011(Grafana)·-L 3012:127.0.0.1:3012(Metabase). 외부노출은 HIS nginx 협의.
services:
  grafana:
    image: grafana/grafana:11.3.0
    container_name: erp-grafana
    restart: unless-stopped
    ports: ["127.0.0.1:3011:3000"]        # 루프백 — 외부는 SSH 터널/HIS nginx 경유
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?set in .env.bi}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # auth.proxy SSO — nginx가 ERP 세션 검증 후 X-WEBAUTH-USER/ROLE 주입(사용자별 계정·역할).
      # ERP 로그인 사용자는 재로그인 없이, ADMIN→Admin·MANAGER/DIRECTOR→Editor(그래프 편집/저장)·그외 Viewer.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_HEADERS: "Role:X-WEBAUTH-ROLE"   # ERP 역할 → Grafana 역할 동기화
      # 신뢰 소스 화이트리스트(방어심층·전체검토 2026-07-03) — nginx(동일호스트 도커 게이트웨이)만
      # X-WEBAUTH-* 주입 허용. loopback 우회로 3011 직접 도달하는 발신자의 헤더 스푸핑→Admin 차단.
      GF_AUTH_PROXY_WHITELIST: ${GF_AUTH_PROXY_WHITELIST:-172.16.0.0/12,127.0.0.1/32}
      GF_AUTH_PROXY_SYNC_TTL: "60"
      GF_AUTH_BASIC_ENABLED: "true"          # admin은 /erp/bi/login 로 관리 로그인 가능(fallback)
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # 서브패스 서빙 — HIS nginx /erp/bi/ 라우트 뒤에서 동작(런북 §4). 쿠키 Path=/erp/ 재사용 위해 /erp/ 하위.
      GF_SERVER_ROOT_URL: ${GF_ROOT_URL:-https://his.example.org/erp/bi/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/erp-executive.json
      ERP_BI_PASSWORD: ${ERP_BI_PASSWORD:?set in .env.bi}   # 프로비저닝 datasource가 참조
    volumes:
      - ./bi/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./bi/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - erp_grafana:/var/lib/grafana
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }   # busy 박스 — 경량 캡

  metabase:
    image: metabase/metabase:v0.51.6
    container_name: erp-metabase
    restart: unless-stopped
    ports: ["127.0.0.1:3012:3000"]
    environment:
      MB_DB_TYPE: h2                              # POC 메타데이터=H2 파일. 운영 시 별도 PG db 권장.
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: Asia/Seoul
      MB_CHECK_FOR_UPDATES: "false"
      MB_ANON_TRACKING_ENABLED: "false"
      # 서브패스 /erp/mb/ 서빙 — nginx가 ERP 세션 게이트 후 프록시. Metabase 자체 로그인(별도 기능).
      MB_SITE_URL: ${MB_SITE_URL:-https://his.example.org/erp/mb}
    volumes:
      - erp_metabase:/metabase-data
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1280M }   # JVM — 무거움. 셀프서비스 확정 후 운영(기획서 §8 P2)

volumes:
  erp_grafana:
  erp_metabase:

# HIS 공유 네트워크 합류 — postgres 서비스명으로 reporting 마트 접근(erp_bi)
networks:
  default:
    name: docker_default
    external: true
