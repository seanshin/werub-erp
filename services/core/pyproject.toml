[project]
name = "erp-core"
version = "1.306.1"
description = "hospital-erp core service (Modular Monolith)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.137",  # 0.137 lazy include_router(_IncludedRouter)로 .routes 구조 변경 — 앱 미검증, 핀 유지
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "cryptography>=50",   # PYSEC-2026-3552(49.0.0 취약) 이상 고정
    "redis>=5.0",
    "httpx>=0.27",
    "APScheduler>=3.10",
    "openpyxl>=3.1",
    "Jinja2>=3.1",
    "weasyprint>=62",
    "webauthn>=2.0",
    "tzdata>=2024.1",  # ZoneInfo("Asia/Seoul") 시스템 zoneinfo 비의존화(배치 KST 판정·베이스이미지 무관)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff==0.15.22",   # 핀 — CI가 최신 ruff 설치 시 신규 규칙(UP017 등)이 비결정적으로 CI 파손하는 것 방지
    "import-linter>=2.0",
    "freezegun>=1.5",   # 미래 시점 스위트 점검(tests/tools/futureclock.py) — CI 상시 레인 아님
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.importlinter]
root_package = "erp"
# 모듈 경계 계층화 — 레이어: erp.app(크로스도메인 집계·오케스트레이션) > 도메인 > common·audit(커널).
# 전면 계층화 완료(2026-06-14): 공통 커널 정리(집계 라우터 app 이전)·hr↔finance 순환 해소(month-end app 이전).

[[tool.importlinter.contracts]]
name = "audit는 독립(어떤 도메인도 import 금지)"
type = "forbidden"
allow_indirect_imports = "True"
source_modules = ["erp.audit"]
forbidden_modules = [
    "erp.common", "erp.regulatory", "erp.hr", "erp.claims", "erp.patient",
    "erp.scm", "erp.finance", "erp.costing", "erp.analytics", "erp.tax",
    "erp.integrations",
]

[[tool.importlinter.contracts]]
name = "scm 경계 — finance·common·audit만 의존"
type = "forbidden"
allow_indirect_imports = "True"
source_modules = ["erp.scm"]
forbidden_modules = [
    "erp.hr", "erp.claims", "erp.patient", "erp.regulatory",
    "erp.integrations", "erp.analytics", "erp.costing", "erp.tax",
]

[[tool.importlinter.contracts]]
name = "finance 경계 — 도메인 역류 금지(common·audit만, hr↔finance 순환 해소 Phase 2)"
type = "forbidden"
allow_indirect_imports = "True"
source_modules = ["erp.finance"]
forbidden_modules = [
    "erp.app", "erp.hr", "erp.claims", "erp.patient", "erp.scm",
    "erp.regulatory", "erp.integrations", "erp.analytics", "erp.costing", "erp.tax",
]

[[tool.importlinter.contracts]]
name = "tax 경계"
type = "forbidden"
allow_indirect_imports = "True"
source_modules = ["erp.tax"]
forbidden_modules = [
    "erp.claims", "erp.scm", "erp.regulatory", "erp.integrations",
    "erp.analytics", "erp.costing", "erp.patient",
]

[[tool.importlinter.contracts]]
name = "costing 경계"
type = "forbidden"
allow_indirect_imports = "True"
source_modules = ["erp.costing"]
forbidden_modules = [
    "erp.patient", "erp.scm", "erp.regulatory", "erp.integrations",
    "erp.analytics", "erp.tax",
]

[[tool.importlinter.contracts]]
name = "analytics는 집계 전용 — 연동·규제·심사·세무 직접 접근 금지"
type = "forbidden"
allow_indirect_imports = "True"
source_modules = ["erp.analytics"]
forbidden_modules = [
    "erp.integrations", "erp.regulatory", "erp.claims", "erp.tax",
]

[[tool.importlinter.contracts]]
name = "common은 순수 커널 — 도메인·app 역류 금지(계층화 Phase 1)"
type = "forbidden"
allow_indirect_imports = "True"
source_modules = ["erp.common"]
forbidden_modules = [
    "erp.app", "erp.hr", "erp.claims", "erp.patient", "erp.scm",
    "erp.finance", "erp.costing", "erp.analytics", "erp.tax",
    "erp.regulatory", "erp.integrations",
]
