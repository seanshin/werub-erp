<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  @page { size: A4; margin: 25mm; }
  body { font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #1a1a1a; }
  h1 { text-align: center; font-size: 22pt; letter-spacing: 12pt; margin: 30mm 0 20mm; }
  table { width: 100%; border-collapse: collapse; font-size: 11pt; }
  th, td { border: 1px solid #444; padding: 8pt 10pt; }
  th { background: #f0f2f5; width: 30%; text-align: left; font-weight: 600; }
  .purpose { margin-top: 14mm; font-size: 11pt; }
  .attest { margin-top: 20mm; text-align: center; font-size: 12pt; line-height: 1.9; }
  .footer { margin-top: 16mm; text-align: center; font-size: 13pt; font-weight: 700; }
  .issue-no { font-size: 9pt; color: #666; }
  .logo { display: block; margin: 0 auto 4mm; max-height: 22mm; max-width: 60mm; }
</style>
</head>
<body>
  {% if logo %}<img class="logo" src="{{ logo }}" alt="">{% endif %}
  <p class="issue-no">발급번호: {{ issue_no }}</p>
  <h1>{{ title }}</h1>
  <table>
    <tr><th>성명</th><td>{{ name }}</td></tr>
    <tr><th>사번</th><td>{{ employee_no }}</td></tr>
    <tr><th>부서</th><td>{{ department }}</td></tr>
    <tr><th>직급</th><td>{{ position }}</td></tr>
    <tr><th>재직기간</th><td>{{ hired_on }} ~ {{ until }}</td></tr>
  </table>
  {% if purpose %}<p class="purpose">용도: {{ purpose }}</p>{% endif %}
  <p class="attest">위와 같이 {{ kind_text }} 사실을 증명합니다.</p>
  <p class="footer">{{ issued_on }}<br><br>{{ hospital_name }}</p>
</body>
</html>
